<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The Internet History in Canada</title>
        <link href="/public/css/vis_lib/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
        <script src="/public/script/vis_lib/vis-timeline-graph2d.min.js"></script>
        <script src="/public/script/chart_lib/chart.umd.min.js"></script>
        <link href="/public/css/style.css" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="public/script/supabase-client.js"></script>
        <script src="public/script/signup.js" defer></script>
        <script src="/public/script/signin.js" defer></script>
        <script src="public/script/navigation.js" defer></script>
        <script src="public/script/auth-ui.js" defer></script>
        <script type="module" src="/public/script/app.js"></script>
    </head>
    <body data-category="technology">
        <header>
            <nav id="guests-links" aria-label="Account">
                <button id="sign-in" type="button">Sign In</button>
                <button id="sign-up" type="button">Sign Up</button>
            </nav>
            <nav id="user-controls" hidden>
                <span id="user-name"></span>
                <button type="button" id="sign-out">Sign Out</button>
            </nav>

            <div id="title">
                <img id="logo" src="/public/assets/images/logo.png" alt="The Internet History in Canada logo" />
                <h1>The Internet History in Canada</h1>
            </div>

            <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="toolbar">Menu</button>

            <div id="toolbar" role="navigation" aria-label="Navigation between pages">
                <button id="technology" type="button">Technology</button>
                <button id="legislation" type="button">Legislation</button>
                <button id="statistics" type="button">Statistics</button>
            </div>
        </header>
        <main>
            <div class="loading">Page is loading ...</div>
        </main>
        <div id="contribute" role="form" aria-label="content contribution"></div>
    </body>
</html>
