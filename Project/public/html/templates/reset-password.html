<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Reset Password</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
        <script src="/public/script/supabase-client.js" defer></script>
        <script src="/public/script/reset-password.js" defer></script>
    </head>
    <body>
        <h1>Choose a new password</h1>

        <form id="reset-password">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" required />

            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" required />

            <button type="submit" disabled>Update Password</button>
        </form>

        <p id="reset-message" role="status">Checking your reset link...</p>
        <a href="/">Back to home</a>
    </body>
</html>
